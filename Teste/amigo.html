</head>
<body>

```
<div class="caixa">

    <div class="simbolo">⛧</div>

    <h2>Você é amigo ou inimigo?</h2>

    <p>Somente aqueles que conhecem o código podem prosseguir.</p>

    <input
        type="password"
        id="codigo"
        class="form-control mb-3"
        placeholder="Digite o código">

    <button
        class="btn btn-danger w-100"
        onclick="verificarCodigo()">

        Prosseguir

    </button>

    <div id="mensagem"></div>

</div>

<script>

    function verificarCodigo(){

        const codigo =
            document.getElementById("codigo")
            .value
            .toLowerCase()
            .trim();

        if(codigo === "johan"){

            window.location.href = "vilao.html";

        }else{

            document.getElementById("mensagem")
            .innerHTML =
            "Código incorreto. Observe os sinais espalhados pelo site.";

        }

    }

</script>
```

</body>
